<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coursework Manager</title>
</head>
<body>
    <h1>Coursework Manager</h1>
    <nav>
        <a href="index.html">Courses</a> | <a href="assessments.html">Assessments</a>
    </nav>
    <section>
        <h2>Courses</h2>
        <table id="courseTable">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Semester</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="courseTableBody"></tbody>
        </table>
        <h3>Add Course</h3>
        <form id="courseForm">
            <input type="text" id="code" placeholder="Course code" required>
            <input type="text" id="name" placeholder="Course name" required>
            <input type="text" id="semester" placeholder="Semester" required>
            <button type="submit">Add Course</button>
        </form>
    </section>

    <script src="js/courses.js"></script>
</body>
</html>
