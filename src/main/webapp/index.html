<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coursework Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h3>Coursework manager</h3>
            <a href="index.html" class="nav-item active"><span class="hash">#</span> courses</a>
            <a href="assessments.html" class="nav-item"><span class="hash">#</span> assessments</a>
        </aside>

        <main class="main">
            <h1>Courses</h1>
            <p class="sub" id="semesterLabel"></p>

            <div class="stats" id="statsRow"></div>

            <h2>Your courses</h2>
            <div class="courses" id="courseCards"></div>

            <h2>Add course</h2>
            <form id="courseForm" class="panel-form">
                <input type="text" id="code" placeholder="Course code" required>
                <input type="text" id="name" placeholder="Course name" required>
                <input type="text" id="semester" placeholder="Semester" required>
                <button type="submit">Add course</button>
            </form>
        </main>
    </div>

    <script src="js/courses.js"></script>
</body>
</html>
