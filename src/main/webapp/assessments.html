<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assessments - Coursework Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h3>Coursework manager</h3>
            <a href="index.html" class="nav-item"><span class="hash">#</span> courses</a>
            <a href="assessments.html" class="nav-item active"><span class="hash">#</span> assessments</a>
        </aside>

        <main class="main">
            <h1>Assessments</h1>
            <p class="sub">Across all courses</p>

            <h2>All assessments</h2>
            <div id="assessmentRows"></div>

            <h2 style="margin-top: 24px;">Add assessment</h2>
            <form id="assessmentForm" class="panel-form">
                <select id="courseId" required>
                    <option value="">Select a course</option>
                </select>
                <input type="text" id="title" placeholder="Title" required>
                <input type="date" id="dueDate" required>
                <input type="number" id="weight" placeholder="Weight %" min="0" max="100" step="0.1" required>
                <input type="text" id="priority" placeholder="Priority">
                <textarea id="notes" placeholder="Notes"></textarea>
                <button type="submit">Add assessment</button>
            </form>
        </main>
    </div>

    <script src="js/assessments.js"></script>
</body>
</html>
