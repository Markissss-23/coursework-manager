<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assessments - Coursework Manager</title>
</head>
<body>
    <h1>Coursework Manager</h1>
    <nav><a href="index.html">Courses</a> | <a href="assessments.html">Assessments</a></nav>

    <section>
        <h2>Assessments</h2>
        <table id="assessmentTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Course</th>
                    <th>Due Date</th>
                    <th>Weight</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="assessmentTableBody"></tbody>
        </table>

        <h3>Add Assessment</h3>
        <form id="assessmentForm">
            <select id="courseId" required>
                <option value="">Select a course</option>
            </select>
            <input type="text" id="title" placeholder="Title" required>
            <input type="date" id="dueDate" required>
            <input type="number" id="weight" placeholder="Weight (%)" min="0" max="100" step="0.1" required>
            <input type="text" id="priority" placeholder="Priority">
            <textarea id="notes" placeholder="Notes"></textarea>
            <button type="submit">Add Assessment</button>
        </form>
    </section>

    <script src="js/assessments.js"></script>
</body>
</html>
